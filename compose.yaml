services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wazimba_rugby
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wazimba_postgres:/var/lib/postgresql/data

volumes:
  wazimba_postgres:
